name: UptimeRobot business hours

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # Redundant weekday wake attempts at 07:30, 07:50, and 08:10 KST.
    - cron: "30,50 22 * * 0-4"
    - cron: "10 23 * * 0-4"
    # Redundant weekday pause attempts at 18:00 and 18:20 KST.
    - cron: "0,20 9 * * 1-5"
    # Hourly watchdog. The script determines resume/pause from the actual KST time.
    # This recovers automatically when GitHub drops one of the targeted runs above.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Choose whether to resume or pause both monitors"
        required: true
        type: choice
        options:
          - resume
          - pause

permissions:
  contents: read

concurrency:
  group: uptimerobot-business-hours
  cancel-in-progress: false

jobs:
  update-monitors:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Select action
        id: selected
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ACTION: ${{ inputs.action }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            action="$MANUAL_ACTION"
          else
            # Decide from the actual current time, not from the cron expression.
            # This prevents a delayed evening job from pausing monitors the next morning.
            weekday="$(TZ=Asia/Seoul date +%u)"
            time_kst="$(TZ=Asia/Seoul date +%H%M)"
            echo "Current KST: weekday=$weekday time=$time_kst"

            if (( weekday >= 1 && weekday <= 5 )) && \
               (( 10#$time_kst >= 730 && 10#$time_kst < 1800 )); then
              action="resume"
            else
              action="pause"
            fi
          fi

          if [[ "$action" == "resume" ]]; then
            echo "status=1" >> "$GITHUB_OUTPUT"
          else
            echo "status=0" >> "$GITHUB_OUTPUT"
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        shell: bash
        env:
          API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
          B2C_MONITOR_ID: ${{ secrets.UPTIMEROBOT_B2C_MONITOR_ID }}
          LOGISTICS_MONITOR_ID: ${{ secrets.UPTIMEROBOT_LOGISTICS_MONITOR_ID }}
        run: |
          [[ -n "$API_KEY" ]] || { echo "UPTIMEROBOT_API_KEY is missing"; exit 1; }
          [[ -n "$B2C_MONITOR_ID" ]] || { echo "UPTIMEROBOT_B2C_MONITOR_ID is missing"; exit 1; }
          [[ -n "$LOGISTICS_MONITOR_ID" ]] || { echo "UPTIMEROBOT_LOGISTICS_MONITOR_ID is missing"; exit 1; }

      - name: Update both monitors
        shell: bash
        env:
          API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
          B2C_MONITOR_ID: ${{ secrets.UPTIMEROBOT_B2C_MONITOR_ID }}
          LOGISTICS_MONITOR_ID: ${{ secrets.UPTIMEROBOT_LOGISTICS_MONITOR_ID }}
          TARGET_STATUS: ${{ steps.selected.outputs.status }}
          TARGET_ACTION: ${{ steps.selected.outputs.action }}
        run: |
          update_monitor() {
            local name="$1"
            local monitor_id="$2"
            local response
            local body
            local http_code
            local attempt

            for attempt in {1..6}; do
              response="$(curl --silent --show-error \
                --connect-timeout 15 \
                --max-time 30 \
                --request POST \
                --data-urlencode "api_key=$API_KEY" \
                --data-urlencode "id=$monitor_id" \
                --data-urlencode "status=$TARGET_STATUS" \
                --data-urlencode "format=json" \
                --write-out $'\n%{http_code}' \
                https://api.uptimerobot.com/v2/editMonitor)" || true

              http_code="${response##*$'\n'}"
              body="${response%$'\n'*}"

              if [[ "$http_code" =~ ^2[0-9][0-9]$ ]] && \
                 [[ "$(jq -r '.stat // empty' <<< "$body" 2>/dev/null)" == "ok" ]]; then
                echo "$name monitor: $TARGET_ACTION succeeded on attempt $attempt"
                return 0
              fi

              echo "Attempt $attempt failed for $name (HTTP $http_code): $body"
              if (( attempt < 6 )); then
                sleep 20
              fi
            done

            echo "Failed to $TARGET_ACTION $name monitor after 6 attempts"
            return 1
          }

          update_monitor "B2C Sales Management" "$B2C_MONITOR_ID"
          update_monitor "Logistics System" "$LOGISTICS_MONITOR_ID"

      - name: Wake and verify both Render services
        if: steps.selected.outputs.action == 'resume'
        shell: bash
        env:
          API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
          B2C_MONITOR_ID: ${{ secrets.UPTIMEROBOT_B2C_MONITOR_ID }}
          LOGISTICS_MONITOR_ID: ${{ secrets.UPTIMEROBOT_LOGISTICS_MONITOR_ID }}
        run: |
          get_monitor_url() {
            local monitor_id="$1"
            local response
            local url

            response="$(curl --fail --silent --show-error \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 10 \
              --request POST \
              --data-urlencode "api_key=$API_KEY" \
              --data-urlencode "monitors=$monitor_id" \
              --data-urlencode "format=json" \
              https://api.uptimerobot.com/v2/getMonitors)"

            url="$(jq -r '.monitors[0].url // empty' <<< "$response")"
            [[ -n "$url" ]] || {
              echo "Could not retrieve the URL for monitor $monitor_id" >&2
              return 1
            }
            printf '%s' "$url"
          }

          warm_service() {
            local name="$1"
            local url="$2"
            local attempt
            local http_code

            for attempt in {1..12}; do
              http_code="$(curl --location --silent --show-error \
                --output /dev/null \
                --connect-timeout 10 \
                --max-time 20 \
                --write-out '%{http_code}' \
                "$url")" || true

              if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
                echo "$name is awake (HTTP $http_code) on attempt $attempt"
                return 0
              fi

              echo "$name wake attempt $attempt returned HTTP $http_code"
              if (( attempt < 12 )); then
                sleep 30
              fi
            done

            echo "$name did not wake after 12 attempts"
            return 1
          }

          b2c_url="$(get_monitor_url "$B2C_MONITOR_ID")"
          logistics_url="$(get_monitor_url "$LOGISTICS_MONITOR_ID")"

          warm_service "B2C Sales Management" "$b2c_url" &
          b2c_pid=$!
          warm_service "Logistics System" "$logistics_url" &
          logistics_pid=$!

          failed=0
          wait "$b2c_pid" || failed=1
          wait "$logistics_pid" || failed=1
          exit "$failed"
